name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate sample data
        run: python -m sentinel.generate_data

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run sample validation
        run: |
          cd sample_expectations
          python -c "
          from sentinel.expectations import load_expectations
          from sentinel.engine import run_validation
          from sentinel.report import generate_console_report
          suite = load_expectations('orders_expectations.yaml')
          report = run_validation(suite)
          print(generate_console_report(report))
          "
